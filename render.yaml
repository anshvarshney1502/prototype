services:
  - type: web
    name: munshi
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /demo
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: munshi
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: AGENT_LLM
        value: gemini-3.5-flash
      - key: TOOL_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
